[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyforge"
version = "0.1.0"
description = "Turn any podcast, video, article or file into an illustrated, interactive story page."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "jinja2>=3.1",
  "jsonschema>=4.20",
  "numpy>=1.26",
  "opencv-python-headless>=4.8,<5",   # 5.x dropped the Haar face detector used for portrait framing
  "feedparser>=6.0",
  "trafilatura>=1.8",
  "yt-dlp>=2024.1",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8"]

[project.scripts]
storyforge = "storyforge.cli:main"

[tool.setuptools.packages.find]
include = ["storyforge*"]

[tool.setuptools.package-data]
storyforge = ["render/templates/*.j2", "render/static/*", "media/data/*.xml", "qa/*.cjs", "qa/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;background:#070b1c;overflow:hidden}
  svg{display:block}
  .txt{font-family:Impact,"Arial Black","Arial Narrow Bold",Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:900;paint-order:stroke fill;stroke:#000;stroke-linejoin:round;text-anchor:middle}
  .spin{transform-box:view-box;transform-origin:0 0}
  /* CSS keyframes: looped motion. The JS master clock owns their currentTime, so every frame is reproducible. */
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes sweep{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(24deg)}}
  @keyframes sweep2{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-18deg)}}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  @keyframes curtain{0%,100%{transform:skewX(-1.5deg)}50%{transform:skewX(1.5deg)}}
  @keyframes flare{0%{opacity:0;transform:scale(.3)}15%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
  .rec{animation:blink 1s linear infinite}
  .pulse{animation:pulse .9s ease-in-out infinite}
  .beam1{animation:sweep 7s ease-in-out infinite}
  .beam2{animation:sweep2 9s ease-in-out infinite}
  .lamp{animation:sway 4.2s ease-in-out infinite}
  .curtain{animation:curtain 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  .flare{animation:flare 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.82);color:#fff;font-family:Impact,"Arial Black",Arial,sans-serif;text-align:center;cursor:pointer;padding:16px;box-sizing:border-box}
  #start h1{margin:0;font-size:min(9vw,54px);letter-spacing:1px;text-shadow:0 0 18px #ff2a2a}
  #start .ep{font-size:min(5vw,26px);color:#ffb347}
  #start .go{margin-top:10px;padding:16px 34px;border:4px solid #fff;border-radius:999px;font-size:min(7vw,38px);box-shadow:0 0 30px rgba(255,60,60,.7)}
  #start p{margin:0;max-width:520px;font-family:Arial,sans-serif;font-weight:700;font-size:min(3.8vw,17px);color:#c9d0ea;line-height:1.4}
</style>

function ui(t) {

/* ---------- master clock ---------- */
function syncCSS(t) { for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; } }
function render(t) {
  t = clamp(t, 0, DUR);
  syncCSS(t); camera(t); world(t); man(t); overlays(t); ui(t);
}
fitOne($('optA'), 700); fitOne($('optB'), 700);
window.renderAt = render;

let start = 0, running = false;
function loop(now) {
  const t = (now - start) / 1000;
  render(Math.min(t, DUR));
  if (t < DUR && running) requestAnimationFrame(loop); else running = false;
}
function play() { start = performance.now(); if (!running) { running = true; requestAnimationFrame(loop); } }
render(0);
if (CAPTURE) { $('start').remove(); window.READY = true; return; }
$('start').addEventListener('pointerdown', e => { e.stopPropagation(); $('start').remove(); play(); }, { once: true });
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') { if ($('start')) $('start').remove(); play(); } });
let taps = [];
addEventListener('pointerdown', () => { const n = performance.now(); taps = taps.filter(x => n - x < 700); taps.push(n); if (taps.length >= 3 && !$('start')) { taps = []; play(); } });
})();

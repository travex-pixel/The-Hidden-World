<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;background:#070b1c;overflow:hidden}
  svg{display:block}
  .txt{font-family:Impact,"Arial Black","Arial Narrow Bold",Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:900;paint-order:stroke fill;stroke:#000;stroke-linejoin:round;text-anchor:middle}
  .spin{transform-box:view-box;transform-origin:0 0}
  /* CSS keyframes: looped motion. The JS master clock owns their currentTime, so every frame is reproducible. */
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes sweep{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(24deg)}}
  @keyframes sweep2{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-18deg)}}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  @keyframes curtain{0%,100%{transform:skewX(-1.5deg)}50%{transform:skewX(1.5deg)}}
  @keyframes flare{0%{opacity:0;transform:scale(.3)}15%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
  .rec{animation:blink 1s linear infinite}
  .pulse{animation:pulse .9s ease-in-out infinite}
  .beam1{animation:sweep 7s ease-in-out infinite}
  .beam2{animation:sweep2 9s ease-in-out infinite}
  .lamp{animation:sway 4.2s ease-in-out infinite}
  .curtain{animation:curtain 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
  .flare{animation:flare 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.82);color:#fff;font-family:Impact,"Arial Black",Arial,sans-serif;text-align:center;cursor:pointer;padding:16px;box-sizing:border-box}
  #start h1{margin:0;font-size:min(9vw,54px);letter-spacing:1px;text-shadow:0 0 18px #ff2a2a}
  #start .ep{font-size:min(5vw,26px);color:#ffb347}
  #start .go{margin-top:10px;padding:16px 34px;border:4px solid #fff;border-radius:999px;font-size:min(7vw,38px);box-shadow:0 0 30px rgba(255,60,60,.7)}
  #start p{margin:0;max-width:520px;font-family:Arial,sans-serif;font-weight:700;font-size:min(3.8vw,17px);color:#c9d0ea;line-height:1.4}
</style>

/* ---------- maths ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oc = x => 1 - Math.pow(1 - x, 3);
const ob = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, s = 0) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + s * 101.3), hash(i + 1 + s * 101.3), u) * 2 - 1; };
const fbm = (x, s = 0) => vnoise(x, s) * .7 + vnoise(x * 2.13, s + 7) * .3;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; };
const pulseAt = (t, times, w) => times.reduce((m, x) => Math.max(m, t >= x ? Math.exp(-(t - x) / w) : 0), 0);
const attr = (el, o) => { for (const k in o) el.setAttribute(k, o[k]); };
const envAt = (arr, t) => { const x = t * VO.fps, i = Math.floor(x); if (i < 0 || i >= arr.length - 1) return 0; return lerp(arr[i], arr[i + 1], x - i); };
const inR = (t, a, b) => t >= a && t < b;

/* ---------- springs, baked once so any frame can be sought ---------- */
const BHZ = 120, NB = DUR * BHZ + 1;
function bake(channels, targetAt, cutTimes, omega, zeta) {
  const out = {}; for (const c of channels) out[c] = new Float32Array(NB);
  let pos = {}, vel = {}, prevT = -1;
  for (let i = 0; i < NB; i++) {
    const t = i / BHZ, tg = targetAt(t);
    const cut = i === 0 || cutTimes.some(c => c > prevT && c <= t + 1e-9);
    for (const c of channels) {
      if (cut) { pos[c] = tg[c]; vel[c] = 0; }
      else {
        const w = omega[c] ?? omega.default, z = zeta[c] ?? zeta.default, h = 1 / BHZ / 4;
        for (let k = 0; k < 4; k++) { vel[c] += (w * w * (tg[c] - pos[c]) - 2 * z * w * vel[c]) * h; pos[c] += vel[c] * h; }
      }
      out[c][i] = pos[c];
    }

  $('phoneF').setAttribute('opacity', phF ? 1 : 0);
  $('phoneB').setAttribute('transform', `translate(${P(BH)}) rotate(${ang(BE, BH) - 90})`);
  $('phoneB').setAttribute('opacity', phB ? 1 : 0);
}

/* ---------- the world ---------- */
function world(t) {
  for (const [id, c] of [['sk0', '#250307'], ['sk1', '#8f0c14'], ['sk2', '#e0281e']]) $(id).setAttribute('stop-color', c);
  attr($('spill'), { fill: '#ff2a2a', opacity: .16 });
  $('dark').setAttribute('opacity', .62);
  $('lampOn').setAttribute('opacity', 0);
  $('switchT').setAttribute('y', 1146);
  $('redwash').setAttribute('opacity', .1);
  $('tvNews').setAttribute('opacity', 0);
  $('tvStatic').setAttribute('opacity', 1);
  BARS.forEach((b, i) => attr(b, { y: 752 + hash(i + Math.floor(t * 12) * 13) * 190, opacity: .3 + hash(i * 3 + Math.floor(t * 12)) * .5 }));
  $('tvHalo').setAttribute('opacity', .25);
  $('mwTime').textContent = fmt(clockSec(t), false);
  $('mwHalo').setAttribute('opacity', .85 + .15 * Math.sin(t * 4));
  $('keysHang').setAttribute('opacity', 1);
  $('gap').setAttribute('fill', '#ff3b30');
  attr($('gapSpill'), { fill: '#ff3b30', opacity: .3 });
  $('foot1').setAttribute('x', 1800); $('foot2').setAttribute('x', 1858);
  // the neighbour's flat (S1 only): the dog there is still up and growling
  const dog = $('dog');
  dog.setAttribute('transform', 'translate(1255 1500)'); dog.setAttribute('opacity', t < 1 ? 1 : 0);
  const breathe = Math.sin(t * 7) * 2;
  $('dogBody').setAttribute('transform', `translate(${fbm(t * 8, 31) * 1.8} ${-36 + breathe})`);
  [...$('dogLegs').children].forEach(l => attr(l, { y: -76 + breathe, height: 76 - breathe }));
  $('hackles').setAttribute('opacity', 1);
  $('dogEye').setAttribute('fill', '#ff3b30');
  attr($('dogEyeH'), { fill: 'url(#redHalo)', opacity: .75 + .25 * Math.sin(t * 4) });
  $('doorBase').setAttribute('transform', ''); $('doorHW').setAttribute('transform', '');
  $('peepGlowG').setAttribute('opacity', 1);
  $('peepHalo').setAttribute('opacity', .75 + .25 * Math.sin(t * 4));
  [...$('peepRings').children].forEach(c => c.setAttribute('opacity', 0));
  $('handle').setAttribute('transform', 'translate(1712 1232)');
  $('handleHalo').setAttribute('opacity', 0);
  const swing = .3 * Math.sin(t * 1.8);
  const cd = `M1667 1141 Q${1707 + swing * 16} ${1192 - Math.abs(swing) * 6} 1748 1131`;
  $('chain').setAttribute('d', cd); $('chainL').setAttribute('d', cd);
  attr($('chainKnob'), { cx: 1748, cy: 1131 });
  // EP2's exterior: his door still open, the wind, the laundry
  $('slidePane').setAttribute('transform', 'translate(-150 0)');
  $('curtainOut').setAttribute('opacity', 1);
  $('curtainOut').setAttribute('transform', `translate(2978 925) skewX(${-8 + fbm(t * 1.4, 81) * 16}) translate(-2978 -925)`);
  $('lau1').setAttribute('transform', `rotate(${8 + fbm(t * 1.7, 82) * 18} 2718 1258)`);
  $('lau2').setAttribute('transform', `rotate(${6 + fbm(t * 1.5, 83) * 14} 2764 1258)`);
  for (const id of ['ngMw', 'ngMwD', 'ngPizza']) $(id).setAttribute('opacity', id === 'ngPizza' ? 0 : .8);
  [...$('ngRings').children].forEach(c => c.setAttribute('opacity', 0));
  const farBlink = Math.floor(t * 3) % 2;
  $('carL1').setAttribute('opacity', t < 8.45 && farBlink ? 1 : .2); $('carL2').setAttribute('opacity', t < 8.45 && !farBlink ? 1 : .2);
  $('carH1').setAttribute('opacity', t < 8.45 && farBlink ? .9 : 0); $('carH2').setAttribute('opacity', t < 8.45 && !farBlink ? .9 : 0);
  // STREET: his car alarm, until he presses the key fob (beep beep), then silence
  let ind = 0;
  if (t < 8.45) ind = farBlink;
  else if (t < 8.85) ind = Math.floor((t - 8.45) * 5) % 2 === 0 ? 1 : 0;
  $('carInd1').setAttribute('opacity', ind * .9); $('carInd2').setAttribute('opacity', ind * .9);
  $('tailL').setAttribute('fill', ind ? '#ff8a6a' : '#7a1a14');
  $('headL').setAttribute('fill', ind ? '#fff2c0' : '#6a5a3a');
  // the lamps go out, far to near. His stays on.
  [8.9, 9.4, 9.9].forEach((off, i) => {
    const k = 2 - i, f = t < off - .15 ? 1 : t < off ? (Math.floor(t * 40) % 2 ? 1 : .2) : 0;
    $('lc' + k).setAttribute('opacity', .45 * f); $('lh' + k).setAttribute('opacity', f); $('lb' + k).setAttribute('opacity', .2 + .8 * f);
  });
  const myF = inR(t, 10.4, 10.7) ? (Math.floor(t * 30) % 2 ? 1 : .3) : inR(t, 21.4, 25) ? .85 + .15 * fbm(t * 6, 91) : 1;
  $('myCone').setAttribute('opacity', .55 * myF); $('myLampH').setAttribute('opacity', myF); $('myLampB').setAttribute('opacity', myF);
  // the people at the end of the road: running... stop... turn... one step closer, together
  [...$('mob').children].forEach((g, i) => {
    const stopX = [8760, 8890, 9020, 9160][i];
    let x = stopX - Math.max(0, 11.6 - t) * (210 + i * 25), bob = t < 11.6 ? Math.abs(Math.sin(t * 11 + i * 1.3)) * -8 : 0, sc = 1;
    const step = io(seg(t, 12.9, 13.5));
    x -= 50 * step; sc += .1 * step;
    const turned = t >= 11.9 + i * .08;
    g.setAttribute('transform', `translate(${x} ${1395 + bob}) scale(${(turned ? -1 : 1) * sc} ${sc})`);
    g.lastChild.setAttribute('opacity', turned ? 1 : 0);
  });
  // landing dust
  const dk = seg(t, 4.72, 5.5);
  [...$('dust').children].forEach((c, i) => {
    const dir = [-1, 1, -1.6, 1.6][i];
    attr(c, { cx: 6760 + dir * (40 + 120 * oc(dk)), cy: 1492 - 30 * oc(dk) * (i < 2 ? 1 : .5), r: 8 + 26 * oc(dk), opacity: dk > 0 && dk < 1 ? .5 * (1 - dk) : 0 });
  });
  // the car: dome light clicks on by itself, someone sits up in the back
  const dome = t >= 21.4 ? (t < 21.55 ? (Math.floor(t * 40) % 2) : 1) : 0;
  $('domeIn').setAttribute('opacity', dome * (.85 + .15 * Math.sin(t * 5)));
  $('domeHalo').setAttribute('opacity', dome * .7);
  [...$('rwRings').children].forEach((c, i) => {
    const ph = t >= 21.5 ? ((t - 21.5) / 1.1 + i / 3) % 1 : 0, on = inR(t, 21.5 + i * .35, 23.2);
    attr(c, { r: 10 + oc(ph) * 180, opacity: on ? (1 - ph) * .9 : 0 });
  });
  const knock = KNOCKS.reduce((a, x) => a + (t >= x ? Math.exp(-(t - x) * 9) * Math.sin((t - x) * 52) : 0), 0);
  const rise = io(seg(t, 22.8, 24.4));
  $('backSeat').setAttribute('transform', `translate(${knock * 4} ${lerp(150, 18, rise)})`);
  $('car').setAttribute('transform', `rotate(${knock * .5} 7600 1500)`);
  $('carHandleHalo').setAttribute('opacity', t >= 28.6 ? .55 + .2 * Math.sin(t * 4) : 0);
}

/* ---------- overlays ---------- */
const SFX = [
  [2.42, 3.1, '[THUD]', 420], [4.72, 5.4, '[THUD]', 420], [5.4, 8.4, '[CAR ALARM]', 420],
  [8.45, 9.0, '[BEEP BEEP]', 420], [9.0, 10.5, '[CLUNK... CLUNK... CLUNK]', 380],
  [11.8, 13.0, '[BARKING ABOVE]', 380], [14.75, 15.4, '[BZZT]', 380], [15.95, 16.6, '[BZZT]', 380],
  [16.8, 17.6, '[PHONE DIES]', 380], [21.4, 22.2, '[CLICK]', 380],
];
const CAPS = [...VO.lines.filter(l => l.kind !== 'end').map(l => [l.a, l.b + .25, l.cap, l.kind, 0]), ...SFX.map(s => [s[0], s[1], s[2], 'sfx', s[3]])];
const CAPEL = { vo: ['vo', 'voG', 1490, 960], sfx: ['sfx', 'sfxG', 420, 980], fr: ['fr', 'frG', 1450, 960] };
function caption(t, kind) {
  const [tid, gid, y0, maxW] = CAPEL[kind];
  let cur = null;
  for (const c of CAPS) if (c[3] === kind && t >= c[0] && t < c[1]) cur = c;
  const g = $(gid);
  if (!cur) { g.setAttribute('opacity', 0); return; }
  setLines($(tid), cur[2], maxW);
  const y = cur[4] || y0, k = seg(t, cur[0], cur[0] + .22), s = lerp(.7, 1, ob(k));
  const rot = kind === 'sfx' ? -4 + Math.sin(t * 2.5) * 1.2 : 0;
  g.setAttribute('opacity', clamp(k * 3));
  g.setAttribute('transform', `translate(540 ${y + (1 - oc(k)) * 18}) rotate(${rot}) scale(${s})`);
}
const BEATS = []; (() => { let x = 18.0; while (x < 25) { BEATS.push(x); x += 60 / lerp(76, 145, (x - 18) / 7); } })();
function overlays(t) {
  // 0–0.85: EP2's ending card; B wins, A falls away. Then the title.
  const startCard = t < 0.85, endCard = t >= 28.6;
  setOne($('optA'), startCard ? 'LET JAY IN' : 'OPEN THE CAR DOOR', 700);
  setOne($('optB'), startCard ? 'DROP TO THE STREET' : 'RUN DOWN THE STREET', 700);
  $('v2').textContent = startCard ? 'HOW DID HE FIND ME?' : "WHY'S HE IN MY CAR?";
  $('ab').setAttribute('opacity', startCard ? 1 - seg(t, .55, .85) : endCard ? 1 : 0);
  $('abDim').setAttribute('opacity', startCard ? .1 * (1 - seg(t, .55, .85)) : endCard ? .1 : 0);
  if (startCard) {
    const k = ob(seg(t, .05, .3)), fall = Math.pow(seg(t, .25, .7), 2);
    attr($('abT'), { opacity: 1, transform: `translate(540 455) rotate(-3)` });
    attr($('v2G'), { opacity: 1 - seg(t, .1, .3), transform: 'translate(540 1495)' });
    attr($('cardA'), { opacity: 1 - seg(t, .25, .6), transform: `translate(${540 - 80 * fall} ${1170 + 500 * fall}) rotate(${-12 * fall})` });
    attr($('cardB'), { opacity: 1, transform: `translate(540 1345) scale(${lerp(1, 1.12, k)})` });
    attr($('voteG'), { opacity: 1 - seg(t, .1, .3), transform: 'translate(540 1575)' });
  } else if (endCard) {
    const pop = (id, a, x, y, rot = 0) => { const k = seg(t, a, a + .26); $(id).setAttribute('opacity', clamp(k * 3)); $(id).setAttribute('transform', `translate(${x} ${y}) scale(${lerp(.6, 1, ob(k))}) rotate(${rot})`); };
    pop('abT', 28.6, 540, 455, -3 + Math.sin(t * 3) * 1);
    pop('v2G', 28.62, 540, 1495);
    pop('cardA', 28.78, 540, 1170);
    pop('cardB', 29.0, 540, 1345);
    pop('voteG', 29.3, 540, 1575);
  }
  const tg = $('titleG');
  if (t >= .5 && t < 1.9) {
    setLines($('title'), 'YOU SAID\nTHE STREET.', 990);
    const s = t < 1.7 ? lerp(.6, 1, ob(seg(t, .5, .85))) * (1 + .02 * Math.sin(t * 5)) : lerp(1, 1.25, io(seg(t, 1.7, 1.9)));
    tg.setAttribute('opacity', t < 1.7 ? clamp((t - .5) * 8) : 1 - seg(t, 1.7, 1.9));
    tg.setAttribute('transform', `translate(540 800) scale(${s}) rotate(${-2 + Math.sin(t * 3) * .8})`);
  } else tg.setAttribute('opacity', 0);
  const fl = Math.max(.42 * pulseAt(t, KNOCKS, .1), .3 * pulseAt(t, [4.72], .12), .15 * pulseAt(t, [1, 2.62, 8, 11.3], .12));
  $('flash').setAttribute('opacity', fl);
  const hb = inR(t, 18, 25) ? pulseAt(t, BEATS, .16) * (.35 + .55 * seg(t, 18, 25)) : 0;
  $('vigRedR').setAttribute('opacity', Math.max(hb, t >= 25 ? .35 + .12 * Math.sin(t * 3) : 0, inR(t, 11.3, 14.6) ? .3 : 0));
  let py = 3000, shake = '';
  if (inR(t, 14.6, 18)) {
    py = lerp(1500, 0, ob(seg(t, 14.6, 14.92))) + lerp(0, 1500, Math.pow(seg(t, 17.8, 18), 2));
    $('lowBatt').setAttribute('opacity', 0);
    const n1 = ob(seg(t, 15.0, 15.3)), n2 = ob(seg(t, 16.2, 16.5));
    $('note1').setAttribute('opacity', clamp(n1)); $('note1').setAttribute('transform', `translate(0 ${lerp(-60, 0, n1)})`);
    $('note2').setAttribute('opacity', clamp(n2)); $('note2').setAttribute('transform', `translate(0 ${lerp(-60, 0, n2)})`);
    $('battTxt').textContent = '0%'; $('battFill').setAttribute('width', 0);
    $('batt').setAttribute('opacity', .55 + .45 * Math.sin(t * 9));
    $('phoneDead').setAttribute('opacity', t >= 16.8 ? (t < 16.95 ? (Math.floor(t * 40) % 2 ? 1 : .3) : 1) : 0);
    if (inR(t, 14.75, 15.2) || inR(t, 15.95, 16.4)) shake = `translate(${fbm(t * 16, 51) * 9} ${fbm(t * 16, 52) * 4}) rotate(${fbm(t * 14, 53) * 2})`;
  }
  $('lockTime').textContent = fmt(clockSec(t), false);
  $('phoneUI').setAttribute('transform', `translate(540 ${930 + py}) rotate(${Math.sin(t * 1.3) * 1})`);
  $('phoneShake').setAttribute('transform', shake);
  const pe = inR(t, 26.4, 28.6);
  $('peep').setAttribute('opacity', pe ? 1 : 0);
  if (pe) {
    const ir = oc(seg(t, 26.4, 26.75)); // his hand wipes a circle in the fogged glass
    $('peepCirc').setAttribute('r', 420 * ir);
    $('peepRing').setAttribute('r', 420 * ir); $('peepRing2').setAttribute('r', 398 * ir);
    $('peepDisp').setAttribute('scale', lerp(90, 22, oc(seg(t, 26.4, 27.2))) + 8 * Math.sin(t * 3.5));
    const lean = io(seg(t, 26.8, 27.7)), speak = envAt(VO.fenv, t);
    // the tell: the cap is on FORWARDS this time (friendShapeFwd)
    $('friend').setAttribute('transform', `translate(560 1180) scale(${1 + .07 * lean + .01 * speak}) rotate(${Math.sin(t * 1.2) * 1.4 - 3 * lean + speak * 1.2}) translate(-560 -1180)`);
    [...$('peepRipple').children].forEach((c, i) => { const ph = ((t - 26.4) / 1.3 + i / 3) % 1; attr(c, { r: 40 + oc(ph) * 380, opacity: (1 - ph) * .5 }); });
  }
  ['k1', 'k2', 'k3'].forEach((id, i) => {
    const a = KNOCKS[i], on = t >= a && t < 26.4, k = seg(t, a, a + .14);
    $(id).setAttribute('opacity', on ? 1 : 0);
    const base = [[290, 560, -8], [790, 470, 6], [540, 720, -3]][i];
    $(id).setAttribute('transform', `translate(${base[0]} ${base[1]}) rotate(${base[2]}) scale(${lerp(1.6, 1, oc(k))})`);
  });
  caption(t, 'vo'); caption(t, 'sfx'); caption(t, 'fr');
}
function ui(t) {
  $('clock').textContent = fmt(clockSec(t), true);
  const j = JUMPS.reduce((m, x) => (t >= x ? x : m), -9);
  const k = seg(t, j, j + .4);
  $('clock').setAttribute('fill', k < 1 ? mix('#ffb347', '#ff3b30', k) : '#ff3b30');
  $('clockG').setAttribute('transform', `translate(540 165) scale(${k < 1 ? lerp(1.25, 1, ob(k)) : 1})`);
}

function syncCSS(t) { for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; } }
function render(t) {
  t = clamp(t, 0, DUR);
  syncCSS(t); camera(t); world(t); man(t); overlays(t); ui(t);
}
window.renderAt = render;

let start = 0, running = false;
function loop(now) {
  const t = (now - start) / 1000;
  render(Math.min(t, DUR));
  if (t < DUR && running) requestAnimationFrame(loop); else running = false;
}
function play() { start = performance.now(); if (!running) { running = true; requestAnimationFrame(loop); } }
render(0);
if (CAPTURE) { $('start').remove(); window.READY = true; return; }
$('start').addEventListener('pointerdown', e => { e.stopPropagation(); $('start').remove(); play(); }, { once: true });
addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') { if ($('start')) $('start').remove(); play(); } });
let taps = [];
addEventListener('pointerdown', () => { const n = performance.now(); taps = taps.filter(x => n - x < 700); taps.push(n); if (taps.length >= 3 && !$('start')) { taps = []; play(); } });
})();
</script>

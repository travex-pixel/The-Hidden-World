<script>
const DATA = {"youtube_title": "The Nicest Person in the Office Might Be Playing You", "episode_line": "Episode 1 · The Favour", "specs": {"width": 1920, "height": 1080, "fps": 30.0, "duration": 539.667, "size": 97888789, "codecs": "H.264 · AAC"}, "chapters": [{"t": 0.0, "title": "Monday, 9:07"}, {"t": 21.702, "title": "The team"}, {"t": 74.049, "title": "The favour"}, {"t": 156.051, "title": "The blame"}, {"t": 255.584, "title": "The quiet forces"}, {"t": 339.528, "title": "The paper trail"}, {"t": 400.836, "title": "Friday, 10:00"}, {"t": 462.629, "title": "Two conversations"}, {"t": 510.218, "title": "What to do instead"}], "download_name": "The-Quiet-Game-E01-The-Favour-1080p.mp4", "kit": [{"label": "Title", "text": "The Nicest Person in the Office Might Be Playing You", "open": true}, {"label": "Description", "text": "His manager asked for one small favour. By Thursday, a colleague was being blamed for a mistake she didn't make.\n\nTHE QUIET GAME is an animated psychological drama about the hidden games that shape careers, reputations and power at work. In Episode 1, Daniel, a careful reporting analyst, is asked by a warm, reasonable, well-liked manager to leave a small error out of a client report \"until it can be fixed\". It doesn't feel like a lie. It feels like returning a favour. Then the client notices, and someone else takes the blame.\n\nIn this episode:\n• Reciprocity: why a string of small kindnesses can make \"no\" feel like an unpaid debt\n• Cognitive dissonance: how decent people rewrite the story instead of changing what they did (and what recent replications say about it)\n• Pluralistic ignorance: why a whole room can stay silent when everyone privately doubts what's happening\n• Foot in the door: how a small yes makes the next, bigger request feel smaller\n• Four practical moves: write it down, confirm in writing, ask neutral questions, correct the record early\n\nChapters\n0:00 Monday, 9:07\n0:21 The team\n1:14 The favour\n2:36 The blame\n4:15 The quiet forces\n5:39 The paper trail\n6:40 Friday, 10:00\n7:42 Two conversations\n8:30 What to do instead\n\nMost favours at work are just kindness. This episode is about the rare ones that ask you to hide something, and what you can do when it happens to you.\n\nThis is a fictional story. Characters, companies and events are invented. The psychology is real; sources are below.\n\nSources\n• Gouldner (1960), The norm of reciprocity, American Sociological Review: https://doi.org/10.2307/2092623\n• Regan (1971), Effects of a favor and liking on compliance, J. Experimental Social Psychology: https://doi.org/10.1016/0022-1031(71)90025-4\n• Festinger & Carlsmith (1959), Cognitive consequences of forced compliance: https://doi.org/10.1037/h0041593\n• Vaidis et al. (2024), multilab replication of induced-compliance dissonance: https://doi.org/10.1177/25152459231213375\n• Prentice & Miller (1993), Pluralistic ignorance and alcohol use on campus: https://doi.org/10.1037/0022-3514.64.2.243\n• Morrison & Milliken (2000), Organizational silence: https://doi.org/10.2307/259200\n• Freedman & Fraser (1966), The foot-in-the-door technique: https://doi.org/10.1037/h0023552\n\nIf the story felt familiar, tell us in the comments what you did, or wish you'd done. Subscribe for the next episode of The Quiet Game.\n\n#OfficePolitics #WorkplacePsychology #TheQuietGame", "save": "description.txt"}, {"label": "Chapters", "text": "0:00 Monday, 9:07\n0:21 The team\n1:14 The favour\n2:36 The blame\n4:15 The quiet forces\n5:39 The paper trail\n6:40 Friday, 10:00\n7:42 Two conversations\n8:30 What to do instead"}, {"label": "Captions (SRT)", "text": "1\n00:00:00,670 --> 00:00:05,175\nAt 9:07 on Monday morning, Daniel Hale did\nhis manager a favour.\n\n2\n00:00:05,745 --> 00:00:09,287\nBy Thursday, a colleague was being blamed\nfor a mistake she hadn't made.\n\n3\n00:00:09,857 --> 00:00:13,827\nDaniel knew the truth. So did one other\nperson: his manager.\n\n4\n00:00:14,267 --> 00:00:16,802\nAnd his manager never once raised his\nvoice.\n\n5\n00:00:22,722 --> 00:00:23,918\nRewind to Monday.\n\n6\n00:00:24,098 --> 00:00:28,249\nDaniel Hale, thirty-two. Reporting analyst\nat a logistics firm.\n\n7\n00:00:28,429 --> 00:00:31,655\nThe person everyone sends their\nspreadsheets to when they need them right.\n\n8\n00:00:33,415 --> 00:00:37,807\nLeah: Final depot extract's in the folder.\nEvery depot, every delivery.\n\n9\n00:00:38,107 --> 00:00:41,602\nDaniel: You're a star. I'll have the\nclient pack out by ten.\n\n10\n00:00:42,172 --> 00:00:45,630\nLeah Carter joined eight months ago. She\nbuilds the data.\n\n11\n00:00:45,810 --> 00:00:48,412\nDaniel turns it into the report the client\nsees.\n\n12\n00:00:51,532 --> 00:00:53,860\nGraham: Flat white, no sugar. Big day.\n\n13\n00:00:54,160 --> 00:00:55,242\nDaniel: You remembered.\n\n14\n00:00:55,712 --> 00:00:57,140\nGraham: I always remember.\n\n15\n00:00:57,970 --> 00:01:01,685\nHe's patient, generous, and very good at\nremembering things.\n\n16\n00:01:01,865 --> 00:01:05,395\nLast month, he approved Daniel's leave at\na day's notice.\n\n17\n00:01:05,575 --> 00:01:08,951\nTwo weeks ago, he put Daniel's name\nforward for promotion.\n\n18\n00:01:10,741 --> 00:01:13,049\nDaniel likes him. Most people do.\n\n19\n00:01:14,639 --> 00:01:17,726\nAt 9:03, Daniel notices something small.\n\n20\n00:01:17,906 --> 00:01:21,535\nA filter left over from a system migration\nhas removed one depot.\n\n21\n00:01:21,715 --> 00:01:29,317\nWith Northfield included, on-time delivery\nis 92.6 percent. Without it, 93.4.\n\n22\n00:01:29,667 --> 00:01:32,268\nThe client's contract target is 93.\n\n23\n00:01:34,678 --> 00:01:36,756\nDaniel: Northfield's been filtered out.\n\n24\n00:01:39,646 --> 00:01:43,025\nGraham, got a minute? There's a filter on\nthe Ostrel dashboard.\n\n25\n00:01:43,325 --> 00:01:46,320\nNorthfield's been excluded since the\nmigration.\n\n26\n00:01:47,150 --> 00:01:50,784\nGraham: Ah. That'll be mine. I set it up\nfor the cut-over.\n\n27\n00:01:51,254 --> 00:01:54,356\nDaniel: Without it, we're under target.\nPoint eight under.\n\n28\n00:01:55,606 --> 00:02:00,908\nGraham: The pack goes at ten. Flag it now,\nand it's a week of calls over a rounding error.\n\n29\n00:02:01,548 --> 00:02:06,634\nLeave it out of the notes for now.\nI'll fix it at source before the quarter closes.\n\n30\n00:02:08,914 --> 00:02:10,621\nDaniel: So we just... don't mention it?\n\n31\n00:02:11,701 --> 00:02:15,416\nGraham: We correct it properly. Quietly.\nNo drama.\n\n32\n00:02:16,836 --> 00:02:18,362\nI knew I could trust you.\n\n33\n00:02:23,522 --> 00:02:26,377\nAt 9:58, the report went out.\n\n34\n00:02:26,977 --> 00:02:29,600\nNotes and exceptions: none this quarter.\n\n35\n00:02:30,170 --> 00:02:31,552\nIt didn't feel like a lie.\n\n36\n00:02:31,992 --> 00:02:35,051\nIt felt like a favour, for someone who'd\ndone him plenty.\n\n37\n00:02:36,811 --> 00:02:39,655\nOn Tuesday afternoon, the client noticed.\n\n38\n00:02:42,215 --> 00:02:46,628\nRuth: Ostrel say our Q3 numbers don't\nreconcile. Who built the data?\n\n39\n00:02:46,928 --> 00:02:50,841\nGraham: The extract is Leah's. She's still\nlearning the depot feeds.\n\n40\n00:02:51,401 --> 00:02:55,666\nLet's not pile on her. I'll take her\nthrough the checks myself.\n\n41\n00:02:56,496 --> 00:02:58,533\nNothing Graham said was false.\n\n42\n00:02:58,913 --> 00:03:01,631\nThe extract was Leah's. She was still\nlearning.\n\n43\n00:03:02,711 --> 00:03:06,069\nDaniel could have walked in. It would have\ntaken one sentence.\n\n44\n00:03:06,929 --> 00:03:08,445\nHe stayed at his desk.\n\n45\n00:03:13,715 --> 00:03:16,310\nLeah: Ruth wants to go through my extract.\n\n46\n00:03:16,610 --> 00:03:20,150\nI've checked it three times. It's right,\nisn't it?\n\n47\n00:03:20,870 --> 00:03:22,252\nDaniel: It... looks right to me.\n\n48\n00:03:22,552 --> 00:03:24,444\nLeah: Then where's the difference coming\nfrom?\n\n49\n00:03:25,254 --> 00:03:26,676\nDaniel: I'll take another look.\n\n50\n00:03:28,096 --> 00:03:30,268\nThat was true too. Every word.\n\n51\n00:03:31,938 --> 00:03:36,134\nGraham: How's Leah holding up? Keep an eye\non her for me, would you?\n\n52\n00:03:36,694 --> 00:03:39,355\nYou're the one person here I can count on.\n\n53\n00:03:41,315 --> 00:03:45,483\nFrom today, Leah's extracts get a second\ncheck before they go out.\n\n54\n00:03:46,123 --> 00:03:48,364\nNo blame. Just process.\n\n55\n00:03:50,014 --> 00:03:51,499\nNobody said a word.\n\n56\n00:03:51,679 --> 00:03:54,271\nLeah assumed everyone thought it was her\nfault.\n\n57\n00:03:54,451 --> 00:03:56,890\nDaniel assumed someone else would say\nsomething.\n\n58\n00:03:57,330 --> 00:03:59,493\nEach silence made the next one easier.\n\n59\n00:04:00,573 --> 00:04:05,356\nLeah: You built the client pack. You'd\nhave seen every filter on that dashboard.\n\n60\n00:04:06,076 --> 00:04:07,094\nDid you know?\n\n61\n00:04:08,244 --> 00:04:09,730\nDaniel: Leah... it's complicated.\n\n62\n00:04:10,370 --> 00:04:12,064\nLeah: No. It's really not.\n\n63\n00:04:16,344 --> 00:04:19,121\nLet's pause. Daniel isn't a bad person.\n\n64\n00:04:19,561 --> 00:04:21,593\nSo why does a decent person stay quiet?\n\n65\n00:04:22,503 --> 00:04:25,671\nPsychologists would point to at least\nthree quiet forces.\n\n66\n00:04:28,321 --> 00:04:29,891\nThe first is reciprocity.\n\n67\n00:04:30,241 --> 00:04:33,708\nSociologist Alvin Gouldner described a\nnear-universal norm:\n\n68\n00:04:33,888 --> 00:04:36,716\nwhen someone helps us, we feel we owe\nthem.\n\n69\n00:04:36,896 --> 00:04:40,876\nWhen Graham finally asked, saying no felt\nlike refusing to pay a debt.\n\n70\n00:04:41,706 --> 00:04:47,169\nIn one classic 1971 study, people given a\nfree soft drink by a stranger\n\n71\n00:04:47,349 --> 00:04:51,422\nlater bought about twice as many of his\nraffle tickets as people given nothing.\n\n72\n00:04:52,732 --> 00:04:57,645\nThe second is cognitive dissonance: the\ndiscomfort of acting against your own values.\n\n73\n00:04:58,085 --> 00:05:01,157\nWe often ease it by changing the story,\nnot the behaviour.\n\n74\n00:05:01,507 --> 00:05:06,394\nIt's only point eight percent. Graham will\nfix it. It's not my place.\n\n75\n00:05:06,994 --> 00:05:12,808\nRecent large replications found weaker effects, so\ntreat it as a tendency, not a law.\n\n76\n00:05:13,638 --> 00:05:15,711\nThe third is pluralistic ignorance.\n\n77\n00:05:15,891 --> 00:05:20,136\nMany people privately doubt something, but\neach assumes the others are fine with it.\n\n78\n00:05:20,316 --> 00:05:21,615\nSo nobody speaks.\n\n79\n00:05:22,135 --> 00:05:26,460\nIn one Princeton study, students thought\nthey were more uneasy about campus drinking\n\n80\n00:05:26,640 --> 00:05:30,557\nthan their peers were. Many of their peers\nfelt exactly the same.\n\n81\n00:05:31,127 --> 00:05:35,481\nOnce you've agreed to something small, the\nnext request feels smaller than it is.\n\n82\n00:05:35,831 --> 00:05:38,328\nPsychologists call it the foot in the\ndoor.\n\n83\n00:05:47,688 --> 00:05:49,916\nThe first favour was to stay quiet.\n\n84\n00:05:50,356 --> 00:05:54,271\nThis one was to say something untrue, to a\ndirector, about a colleague.\n\n85\n00:05:55,941 --> 00:05:58,104\nDaniel couldn't know what Graham intended.\n\n86\n00:05:58,794 --> 00:06:00,470\nBut he could control four things:\n\n87\n00:06:00,650 --> 00:06:05,306\nwhat he wrote down, what he confirmed,\nwhat he asked, and what he corrected.\n\n88\n00:06:06,216 --> 00:06:07,834\nFirst, he wrote it down.\n\n89\n00:06:08,524 --> 00:06:11,356\nDates, times, facts. No adjectives.\n\n90\n00:06:14,116 --> 00:06:15,911\nThen he confirmed it in writing.\n\n91\n00:06:17,621 --> 00:06:20,802\nHe asked a neutral question. No\naccusation.\n\n92\n00:06:21,242 --> 00:06:23,474\nJust the facts, and a way forward.\n\n93\n00:06:26,034 --> 00:06:29,361\nGraham: Daniel. Did we really need all\nthat in an email?\n\n94\n00:06:29,921 --> 00:06:31,673\nDaniel: I just want us to be accurate.\n\n95\n00:06:32,313 --> 00:06:34,454\nGraham: I thought we were on the same\npage.\n\n96\n00:06:35,264 --> 00:06:37,516\nDaniel: We are. That's why I wrote it\ndown.\n\n97\n00:06:41,766 --> 00:06:46,151\nRuth: Before Ostrel join us: Daniel, Graham\nsays you can explain the data issue.\n\n98\n00:06:50,541 --> 00:06:52,202\nDaniel: Leah's extract was correct.\n\n99\n00:06:52,762 --> 00:06:56,649\nThe difference is a filter on our\ndashboard that excluded Northfield.\n\n100\n00:06:57,209 --> 00:07:01,281\nI spotted it on Monday, before the report\nwent out, and told Graham.\n\n101\n00:07:04,111 --> 00:07:05,884\nWe agreed not to flag it.\n\n102\n00:07:06,604 --> 00:07:08,933\nI should have corrected that on Tuesday.\n\n103\n00:07:09,573 --> 00:07:11,013\nI'm correcting it now.\n\n104\n00:07:12,573 --> 00:07:13,573\nRuth: Graham?\n\n105\n00:07:14,660 --> 00:07:16,010\nGraham: That's... a fair summary.\n\n106\n00:07:16,650 --> 00:07:20,485\nI meant to fix it before it mattered. I\nshould have been clearer.\n\n107\n00:07:21,315 --> 00:07:25,400\nCalm. Reasonable. Not a raised voice, even\nnow.\n\n108\n00:07:26,870 --> 00:07:29,148\nRuth: Then Ostrel get the corrected figure\ntoday.\n\n109\n00:07:29,708 --> 00:07:32,761\nFrom now on, every dashboard change gets\nlogged.\n\n110\n00:07:33,571 --> 00:07:35,464\nLeah, I'm sorry. You were right.\n\n111\n00:07:36,544 --> 00:07:39,496\nAnd Daniel? Next time, say it on Tuesday.\n\n112\n00:07:40,216 --> 00:07:41,629\nDaniel: Next time, Tuesday.\n\n113\n00:07:43,559 --> 00:07:45,272\nLeah: You could have said it on Tuesday.\n\n114\n00:07:45,992 --> 00:07:46,992\nDaniel: I know.\n\n115\n00:07:47,577 --> 00:07:52,234\nLeah: Graham told me on Tuesday you'd\nraised concerns about my extract.\n\n116\n00:07:53,044 --> 00:07:54,333\nDaniel: I never said that.\n\n117\n00:07:55,053 --> 00:07:56,411\nLeah: I know. Now.\n\n118\n00:07:57,321 --> 00:08:00,027\nGraham had asked Daniel to keep an eye on\nLeah.\n\n119\n00:08:00,627 --> 00:08:03,020\nAnd he'd told Leah that Daniel had doubts\nabout her.\n\n120\n00:08:03,710 --> 00:08:05,714\nEach of them had been watching the other.\n\n121\n00:08:07,644 --> 00:08:09,108\nWas Graham a manipulator?\n\n122\n00:08:09,628 --> 00:08:14,859\nOr just a likeable man protecting himself,\none small, reasonable request at a time?\n\n123\n00:08:15,719 --> 00:08:18,880\nDaniel never found out for certain. He\ndidn't need to.\n\n124\n00:08:20,130 --> 00:08:22,195\nBecause the trap was never the favour.\n\n125\n00:08:22,885 --> 00:08:25,404\nThe manager didn't need everyone to trust\nhim.\n\n126\n00:08:26,004 --> 00:08:28,618\nHe only needed everyone to distrust each\nother.\n\n127\n00:08:30,978 --> 00:08:33,125\nMost favours are just kindness.\n\n128\n00:08:33,645 --> 00:08:37,139\nThe warning sign is a favour that asks you\nto hide something.\n\n129\n00:08:37,739 --> 00:08:40,443\nIf that happens: write down what was\nasked.\n\n130\n00:08:40,623 --> 00:08:42,060\nConfirm it in writing.\n\n131\n00:08:42,240 --> 00:08:43,694\nAsk neutral questions.\n\n132\n00:08:43,874 --> 00:08:47,823\nAnd correct the record early. Silence gets\nmore expensive every day.\n\n133\n00:08:49,953 --> 00:08:53,862\nHave you ever been asked for a small favour\nat work that turned out not to be small?\n\n134\n00:08:54,552 --> 00:08:57,073\nWhat did you do, or what do you wish you'd\ndone?\n", "save": "the-favour-captions.srt.txt", "note": "YouTube Studio → Subtitles → Upload file. If you save it from here, rename the file to end in .srt."}, {"label": "Transcript", "text": "THE QUIET GAME — The Favour\n\nA fictional story. Characters, companies and events are invented. The psychology is real.\n\n\n== 0:00  MONDAY, 9:07 ==\n\n[0:00] NARRATOR: At 9:07 on Monday morning, Daniel Hale did his manager a favour.\n[0:05] NARRATOR: By Thursday, a colleague was being blamed for a mistake she hadn't made.\n[0:09] NARRATOR: Daniel knew the truth. So did one other person: his manager.\n[0:14] NARRATOR: And his manager never once raised his voice.\n[0:17] (Title card: The Quiet Game, Episode 1, The Favour.)\n\n== 0:21  THE TEAM ==\n\n[0:22] NARRATOR: Rewind to Monday.\n[0:24] NARRATOR: Daniel Hale, thirty-two. Reporting analyst at a logistics firm.\n[0:28] NARRATOR: The person everyone sends their spreadsheets to when they need them right.\n[0:33] LEAH: Final depot extract's in the folder. Every depot, every delivery.\n[0:38] DANIEL: You're a star. I'll have the client pack out by ten.\n[0:42] NARRATOR: Leah Carter joined eight months ago. She builds the data.\n[0:45] NARRATOR: Daniel turns it into the report the client sees.\n[0:51] GRAHAM: Flat white, no sugar. Big day.\n[0:54] DANIEL: You remembered.\n[0:55] GRAHAM: I always remember.\n[0:57] NARRATOR: He's patient, generous, and very good at remembering things.\n[1:01] NARRATOR: Last month, he approved Daniel's leave at a day's notice.\n[1:05] NARRATOR: Two weeks ago, he put Daniel's name forward for promotion.\n[1:10] NARRATOR: Daniel likes him. Most people do.\n\n== 1:14  THE FAVOUR ==\n\n[1:14] NARRATOR: At 9:03, Daniel notices something small.\n[1:17] NARRATOR: A filter left over from a system migration has removed one depot.\n[1:21] NARRATOR: With Northfield included, on-time delivery is 92.6 percent. Without it, 93.4.\n[1:29] NARRATOR: The client's contract target is 93.\n[1:34] DANIEL: Northfield's been filtered out.\n[1:39] DANIEL: Graham, got a minute? There's a filter on the Ostrel dashboard.\n[1:43] DANIEL: Northfield's been excluded since the migration.\n[1:47] GRAHAM: Ah. That'll be mine. I set it up for the cut-over.\n[1:51] DANIEL: Without it, we're under target. Point eight under.\n[1:55] GRAHAM: The pack goes at ten. Flag it now, and it's a week of calls over a rounding error.\n[2:01] GRAHAM: Leave it out of the notes for now. I'll fix it at source before the quarter closes.\n[2:08] DANIEL: So we just... don't mention it?\n[2:11] GRAHAM: We correct it properly. Quietly. No drama.\n[2:16] GRAHAM: I knew I could trust you.\n[2:19] (Daniel nods, then looks down.)\n[2:23] NARRATOR: At 9:58, the report went out.\n[2:26] NARRATOR: Notes and exceptions: none this quarter.\n[2:30] NARRATOR: It didn't feel like a lie.\n[2:31] NARRATOR: It felt like a favour, for someone who'd done him plenty.\n\n== 2:36  THE BLAME ==\n\n[2:36] NARRATOR: On Tuesday afternoon, the client noticed.\n[2:42] RUTH: Ostrel say our Q3 numbers don't reconcile. Who built the data?\n[2:46] GRAHAM: The extract is Leah's. She's still learning the depot feeds.\n[2:51] GRAHAM: Let's not pile on her. I'll take her through the checks myself.\n[2:56] NARRATOR: Nothing Graham said was false.\n[2:58] NARRATOR: The extract was Leah's. She was still learning.\n[3:02] NARRATOR: Daniel could have walked in. It would have taken one sentence.\n[3:06] NARRATOR: He stayed at his desk.\n[3:09] (Email from Ruth to Leah: please walk me through your Q3 extract by Thursday.)\n[3:13] LEAH: Ruth wants to go through my extract.\n[3:16] LEAH: I've checked it three times. It's right, isn't it?\n[3:20] DANIEL: It... looks right to me.\n[3:22] LEAH: Then where's the difference coming from?\n[3:25] DANIEL: I'll take another look.\n[3:28] NARRATOR: That was true too. Every word.\n[3:31] GRAHAM: How's Leah holding up? Keep an eye on her for me, would you?\n[3:36] GRAHAM: You're the one person here I can count on.\n[3:41] GRAHAM: From today, Leah's extracts get a second check before they go out.\n[3:46] GRAHAM: No blame. Just process.\n[3:50] NARRATOR: Nobody said a word.\n[3:51] NARRATOR: Leah assumed everyone thought it was her fault.\n[3:54] NARRATOR: Daniel assumed someone else would say something.\n[3:57] NARRATOR: Each silence made the next one easier.\n[4:00] LEAH: You built the client pack. You'd have seen every filter on that dashboard.\n[4:06] LEAH: Did you know?\n[4:08] DANIEL: Leah... it's complicated.\n[4:10] LEAH: No. It's really not.\n[4:12] (Leah walks out. Daniel is left alone.)\n\n== 4:15  THE QUIET FORCES ==\n\n[4:16] NARRATOR: Let's pause. Daniel isn't a bad person.\n[4:19] NARRATOR: So why does a decent person stay quiet?\n[4:22] NARRATOR: Psychologists would point to at least three quiet forces.\n[4:28] NARRATOR: The first is reciprocity.\n[4:30] NARRATOR: Sociologist Alvin Gouldner described a near-universal norm:\n[4:33] NARRATOR: when someone helps us, we feel we owe them.\n[4:36] NARRATOR: When Graham finally asked, saying no felt like refusing to pay a debt.\n[4:41] NARRATOR: In one classic 1971 study, people given a free soft drink by a stranger\n[4:47] NARRATOR: later bought about twice as many of his raffle tickets as people given nothing.\n[4:52] NARRATOR: The second is cognitive dissonance: the discomfort of acting against your own values.\n[4:58] NARRATOR: We often ease it by changing the story, not the behaviour.\n[5:01] NARRATOR: It's only point eight percent. Graham will fix it. It's not my place.\n[5:06] NARRATOR: Recent large replications found weaker effects, so treat it as a tendency, not a law.\n[5:13] NARRATOR: The third is pluralistic ignorance.\n[5:15] NARRATOR: Many people privately doubt something, but each assumes the others are fine with it.\n[5:20] NARRATOR: So nobody speaks.\n[5:22] NARRATOR: In one Princeton study, students thought they were more uneasy about campus drinking\n[5:26] NARRATOR: than their peers were. Many of their peers felt exactly the same.\n[5:31] NARRATOR: Once you've agreed to something small, the next request feels smaller than it is.\n[5:35] NARRATOR: Psychologists call it the foot in the door.\n\n== 5:39  THE PAPER TRAIL ==\n\n[5:39] (Text from Graham: Ruth wants five minutes before tomorrow's review. Just confirm it was an extract issue. Thanks for having my back.)\n[5:47] NARRATOR: The first favour was to stay quiet.\n[5:50] NARRATOR: This one was to say something untrue, to a director, about a colleague.\n[5:55] NARRATOR: Daniel couldn't know what Graham intended.\n[5:58] NARRATOR: But he could control four things:\n[6:00] NARRATOR: what he wrote down, what he confirmed, what he asked, and what he corrected.\n[6:06] NARRATOR: First, he wrote it down.\n[6:08] NARRATOR: Dates, times, facts. No adjectives.\n[6:14] NARRATOR: Then he confirmed it in writing.\n[6:17] NARRATOR: He asked a neutral question. No accusation.\n[6:21] NARRATOR: Just the facts, and a way forward.\n[6:26] GRAHAM: Daniel. Did we really need all that in an email?\n[6:29] DANIEL: I just want us to be accurate.\n[6:32] GRAHAM: I thought we were on the same page.\n[6:35] DANIEL: We are. That's why I wrote it down.\n[6:37] (Graham's smile fades.)\n\n== 6:40  FRIDAY, 10:00 ==\n\n[6:41] RUTH: Before Ostrel join us: Daniel, Graham says you can explain the data issue.\n[6:46] (Graham smiles at Daniel and nods.)\n[6:50] DANIEL: Leah's extract was correct.\n[6:52] DANIEL: The difference is a filter on our dashboard that excluded Northfield.\n[6:57] DANIEL: I spotted it on Monday, before the report went out, and told Graham.\n[7:01] (Leah looks up.)\n[7:04] DANIEL: We agreed not to flag it.\n[7:06] DANIEL: I should have corrected that on Tuesday.\n[7:09] DANIEL: I'm correcting it now.\n[7:12] RUTH: Graham?\n[7:14] GRAHAM: That's... a fair summary.\n[7:16] GRAHAM: I meant to fix it before it mattered. I should have been clearer.\n[7:21] NARRATOR: Calm. Reasonable. Not a raised voice, even now.\n[7:26] RUTH: Then Ostrel get the corrected figure today.\n[7:29] RUTH: From now on, every dashboard change gets logged.\n[7:33] RUTH: Leah, I'm sorry. You were right.\n[7:36] RUTH: And Daniel? Next time, say it on Tuesday.\n[7:40] DANIEL: Next time, Tuesday.\n\n== 7:42  TWO CONVERSATIONS ==\n\n[7:43] LEAH: You could have said it on Tuesday.\n[7:45] DANIEL: I know.\n[7:47] LEAH: Graham told me on Tuesday you'd raised concerns about my extract.\n[7:53] DANIEL: I never said that.\n[7:55] LEAH: I know. Now.\n[7:57] NARRATOR: Graham had asked Daniel to keep an eye on Leah.\n[8:00] NARRATOR: And he'd told Leah that Daniel had doubts about her.\n[8:03] NARRATOR: Each of them had been watching the other.\n[8:07] NARRATOR: Was Graham a manipulator?\n[8:09] NARRATOR: Or just a likeable man protecting himself, one small, reasonable request at a time?\n[8:15] NARRATOR: Daniel never found out for certain. He didn't need to.\n[8:20] NARRATOR: Because the trap was never the favour.\n[8:22] NARRATOR: The manager didn't need everyone to trust him.\n[8:26] NARRATOR: He only needed everyone to distrust each other.\n\n== 8:30  WHAT TO DO INSTEAD ==\n\n[8:30] NARRATOR: Most favours are just kindness.\n[8:33] NARRATOR: The warning sign is a favour that asks you to hide something.\n[8:37] NARRATOR: If that happens: write down what was asked.\n[8:40] NARRATOR: Confirm it in writing.\n[8:42] NARRATOR: Ask neutral questions.\n[8:43] NARRATOR: And correct the record early. Silence gets more expensive every day.\n[8:49] NARRATOR: Have you ever been asked for a small favour at work that turned out not to be small?\n[8:54] NARRATOR: What did you do, or what do you wish you'd done?\n"}, {"label": "Pinned comment and community post", "text": "## Pinned comment\nMost favours at work are just kindness. Reciprocity is how good teams work.\nThe warning sign is a favour that asks you to hide something.\n\nHas that ever happened to you? What did you do, or what do you wish you'd done?\n(Daniel's four moves are at 8:30.)\n\n## Community post\nNew episode: THE QUIET GAME, \"The Favour\" 🎬\nDaniel's manager asked him to leave one small error out of a report, \"just until it's fixed\".\nHe said yes. By Thursday, a colleague was being blamed.\n\nQuick poll: would you have said yes?\n• Yes, it's only small\n• Yes, but I'd put it in writing\n• No, I'd flag it straight away\n• It depends who's asking"}, {"label": "Sources", "text": "# References and research notes: \"The Favour\"\n\nThe story is fiction: Halvern Logistics, Ostrel Foods and every character are invented. The psychology is real. Citations were checked against bibliographic records and reputable secondary sources on 2026-10-11. The original PDFs were not read directly, because publisher pages could not be fetched from the research environment. Anything not confirmed is marked **unverified**. All effects below are **tendencies, not rules**. Many classic studies used small samples of US undergraduates.\n\n## 1. Reciprocity (Chapter 4, \"Force 1\"; the ledger)\n- **Gouldner, A. W. (1960).** The norm of reciprocity: A preliminary statement. *American Sociological Review, 25*(2), 161–178. https://doi.org/10.2307/2092623\n  - A theory essay, not an experiment. It argues that a near-universal moral norm says people should help, and not harm, those who have helped them.\n- **Regan, D. T. (1971).** Effects of a favor and liking on compliance. *Journal of Experimental Social Psychology, 7*(6), 627–639. https://doi.org/10.1016/0022-1031(71)90025-4 (DOI format standard; resolution not confirmed)\n  - Participants believed they were in an art-rating study. A confederate (\"Joe\") either brought them an unrequested soft drink or nothing, then asked them to buy raffle tickets. Favour recipients bought **about twice as many tickets**. Liking predicted purchases mainly when no favour was given.\n  - Caveat: later work (Goei et al., 2003) found liking mattered more than obligation, so the mechanism is debated. The episode says only what was observed.\n- **Narrated:** \"Sociologist Alvin Gouldner described a near-universal norm: when someone helps us, we feel we owe them.\" / \"In one classic 1971 study, people given a free soft drink by a stranger later bought about twice as many of his raffle tickets as people given nothing.\"\n\n## 2. Cognitive dissonance (Chapter 4, \"Force 2\"; the sticky notes)\n- **Festinger, L. (1957).** *A Theory of Cognitive Dissonance.* Stanford University Press.\n- **Festinger, L., & Carlsmith, J. M. (1959).** Cognitive consequences of forced compliance. *Journal of Abnormal and Social Psychology, 58*(2), 203–210. https://doi.org/10.1037/h0041593 · PubMed https://pubmed.ncbi.nlm.nih.gov/13640824/\n  - Students paid $1 to call a dull task enjoyable later rated it more enjoyable than students paid $20.\n- **Vaidis, D. C., et al. (2024).** A multilab replication of the induced-compliance paradigm of cognitive dissonance. *Advances in Methods and Practices in Psychological Science, 7*(1). https://doi.org/10.1177/25152459231213375\n  - 39 labs, N = 4,898. It found **no** difference between high-choice and low-choice conditions, a core textbook prediction.\n- **Why the episode adds a caveat:** after explaining the idea, the narrator says recent large replications found weaker effects, \"so treat it as a tendency, not a law\". The on-screen pill cites Vaidis et al. (2024).\n\n## 3. Pluralistic ignorance and organisational silence (Chapter 3 stand-up; Chapter 4, \"Force 3\")\n- **Katz, D., & Allport, F. H. (1931).** *Students' Attitudes.* The term is usually credited to Allport and Katz, around 1931. Text: https://brocku.ca/MeadProject/Allport/1931/TOC.htm (publisher detail unverified)\n- **Prentice, D. A., & Miller, D. T. (1993).** Pluralistic ignorance and alcohol use on campus. *Journal of Personality and Social Psychology, 64*(2), 243–256. https://doi.org/10.1037/0022-3514.64.2.243\n  - Princeton students believed they were more uncomfortable with campus drinking than the average student was.\n- **Morrison, E. W., & Milliken, F. J. (2000).** Organizational silence. *Academy of Management Review, 25*(4), 706–725. https://doi.org/10.2307/259200\n  - A theory paper: employees collectively withhold concerns when they believe speaking up is futile or risky. (Whether it uses the term \"pluralistic ignorance\" explicitly is unverified.)\n\n## 4. Foot in the door and the slippery slope (Chapter 4 bridge)\n- **Freedman, J. L., & Fraser, S. C. (1966).** Compliance without pressure: The foot-in-the-door technique. *JPSP, 4*(2), 195–202. https://doi.org/10.1037/h0023552\n  - About 17% of homeowners agreed to a large \"Drive Carefully\" lawn sign when asked cold, versus about 76% after first agreeing to a small sign.\n- **Burger, J. M. (1999).** The foot-in-the-door compliance procedure. *Personality and Social Psychology Review, 3*(4), 303–325. The effect is real but conditional and modest in meta-analysis.\n- **Welsh, D. T., Ordóñez, L. D., Snyder, D. G., & Christian, M. S. (2015).** The slippery slope. *Journal of Applied Psychology, 100*(1), 114–127. https://doi.org/10.1037/a0036950\n  - Small unethical acts that escalate gradually led to larger ones more often than abrupt opportunities did.\n\n## 5. Background (shaped the resolution; not narrated)\n- **Edmondson, A. (1999).** Psychological safety and learning behavior in work teams. *Administrative Science Quarterly, 44*(2), 350–383. https://doi.org/10.2307/2666999. Teams that feel safe raising problems do more of the learning behaviour that catches errors. This informed Ruth's \"Next time, Tuesday\" and the logging rule.\n- **Jecker, J., & Landy, D. (1969).** Liking a person as a function of doing him a favor. *Human Relations, 22*(4), 371–378 (the \"Ben Franklin effect\"). It was considered and left out: it is a single small study with thin replication.\n\n## What the episode deliberately does not do\n- It does not diagnose Graham or call him a narcissist, psychopath or similar. His intent stays open (\"Daniel never found out for certain\").\n- It does not say favours are manipulation. It says the opposite: \"Most favours are just kindness. The warning sign is a favour that asks you to hide something.\"\n- It invents no statistics. Every number on screen is either a cited study result or a labelled fictional company figure. The fictional figures are internally consistent and checked by `tests/test_quiet_game.py`.\n"}], "notice": "A fictional story; the psychology is real. This video has not been uploaded or published anywhere. Master file SHA-256 2fd61f89e385510a…", "mode": "local", "src": "../final.mp4", "vtt": "../captions.vtt", "poster": "../thumbnail.png"};

  }
  function seekGlobal(t, play) { let i = segs.findIndex(s => t < s.start + s.dur); if (i < 0) i = segs.length - 1; load(i, Math.max(0, t - segs[i].start), play); }
  v.addEventListener('loadedmetadata', () => { if (pendingSeek !== null) { v.currentTime = pendingSeek; pendingSeek = null; } if (wantPlay) { v.play().catch(() => {}); wantPlay = false; } status.hidden = true; });
  v.addEventListener('ended', () => { if (cur < segs.length - 1) load(cur + 1, 0, true); });
  const chs = DATA.chapters;
  v.addEventListener('timeupdate', () => {
    const g = segs[cur].start + v.currentTime; if (!scrub.matches(':active')) scrub.value = g;
    $('clock').textContent = fmt(g) + ' / ' + fmt(DATA.specs.duration);
    let k = 0; chs.forEach((c, j) => { if (g >= c.t) k = j; }); $('chapnow').textContent = chs.length ? '· ' + chs[k].title : '';
    document.querySelectorAll('.chapters button').forEach((b, j) => b.classList.toggle('on', j === k));
  });
  scrub.addEventListener('change', () => seekGlobal(parseFloat(scrub.value), !v.paused));
  v.addEventListener('error', () => {
    if (DATA.mode === 'local') say('The video did not play. Either final.mp4 is not in the episode folder (it is not stored in Git; see delivery/README.md), or this browser cannot play H.264 MP4. Chrome, Safari, Edge and Firefox on phones and desktops can.', 'bad');
    else say('Part ' + (cur + 1) + ' of the video did not load. Check your connection, then tap a chapter to retry.', 'bad');
  });
  load(0, 0, false);

  chs.forEach(c => { const li = document.createElement('li'); const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<span class="t"></span><span></span>'; b.children[0].textContent = fmt(c.t); b.children[1].textContent = c.title;
    b.addEventListener('click', () => seekGlobal(c.t + 0.05, true)); li.appendChild(b); $('chapters').appendChild(li); });

  // ---------- download
  if (DATA.mode === 'local') {
    const a = $('dl-local'); a.hidden = false; a.href = DATA.src; a.setAttribute('download', DATA.download_name);
    a.textContent = 'Download MP4 (' + mb(DATA.specs.size) + ')';
    $('dlnote').textContent = 'Saves ' + DATA.download_name + ' from this folder.';
  } else {
    const btn = $('dl-hosted'), prog = $('dlprog'), note = $('dlnote'); btn.hidden = false;
    btn.textContent = 'Download full-quality MP4 (' + mb(DATA.specs.size) + ')';
    note.textContent = DATA.download_hint;
    let busy = false;
    btn.addEventListener('click', async () => {
      if (busy) return; busy = true; btn.disabled = true;
      try {
        const downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
        if (!downloads) { note.textContent = 'Saving files is not available in this view. Open this page in the Claude app or claude.ai while signed in, then try again.'; return; }
        const M = DATA.master; const buf = new Uint8Array(M.size); let off = 0; prog.hidden = false; prog.value = 0;
        for (let i = 0; i < M.parts.length; i++) {
          note.textContent = 'Fetching part ' + (i + 1) + ' of ' + M.parts.length + '…';
          const r = await fetch(M.parts[i]); if (!r.ok) throw new Error('Part ' + (i + 1) + ' failed to load (HTTP ' + r.status + ').');
          let b;
          if (M.encoding === 'base64') { const t = (await r.text()).trim(); const bin = atob(t); b = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) b[k] = bin.charCodeAt(k); }
          else b = new Uint8Array(await r.arrayBuffer());
          if (off + b.length > M.size) throw new Error('Part ' + (i + 1) + ' is larger than expected.');
          buf.set(b, off); off += b.length; prog.value = off / M.size;
        }
        if (off !== M.size) throw new Error('Got ' + off + ' bytes, expected ' + M.size + '.');
        note.textContent = 'Checking the file…';
        const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(x => x.toString(16).padStart(2, '0')).join('');
        if (h !== M.sha256) throw new Error('Checksum mismatch: the file is incomplete. Try again.');
        note.textContent = 'Verified. Confirm the save in the prompt.';
        const res = await downloads.save({ filename: DATA.download_name, data: new Blob([buf], { type: 'video/mp4' }) });
        note.textContent = res.status === 'saved' ? 'Saved ' + DATA.download_name + ' (' + mb(M.size) + ', checksum verified). On Android it is in Downloads.' : 'Sent.';
      } catch (e) {
        const code = e && e.code;
        note.textContent = code === 'declined' ? 'Save cancelled.' : code === 'too_large' ? 'This app could not save a file this large. Use the GitHub draft release described in the README instead.' : code === 'rate_limited' ? 'A save prompt is already open. Finish it, then try again.' : 'Download failed: ' + ((e && e.message) || e);
      } finally { busy = false; btn.disabled = false; }
    });
  }

  // ---------- upload kit
  const kit = $('kit');
  DATA.kit.forEach(item => {
    const d = document.createElement('details'); if (item.open) d.open = true;
    const s = document.createElement('summary'); s.textContent = item.label; d.appendChild(s);
    const box = document.createElement('div'); box.className = 'box';
    if (item.note) { const n = document.createElement('div'); n.className = 'small'; n.textContent = item.note; box.appendChild(n); }
    const pre = document.createElement('pre'); pre.textContent = item.text; box.appendChild(pre);
    const row = document.createElement('div'); row.className = 'row';
    const copy = document.createElement('button'); copy.type = 'button'; copy.className = 'btn ghost'; copy.textContent = 'Copy';
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(item.text); copy.textContent = 'Copied'; }
      catch (_) { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); copy.textContent = 'Selected: press copy'; }
      setTimeout(() => { copy.textContent = 'Copy'; }, 2200);
    });
    row.appendChild(copy);
    if (item.save) {
      const sv = document.createElement('button'); sv.type = 'button'; sv.className = 'btn ghost'; sv.textContent = 'Save ' + item.save;
      sv.addEventListener('click', async () => {
        if (DATA.mode === 'local') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([item.text], { type: 'text/plain' })); a.download = item.save; a.click(); return; }
        const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
        if (!dl) { sv.textContent = 'Saving unavailable here'; return; }
        try { await dl.save({ filename: item.save, data: item.text }); sv.textContent = 'Saved'; } catch (e) { sv.textContent = e && e.code === 'declined' ? 'Cancelled' : 'Save failed'; }
      });
      row.appendChild(sv);
    }
    box.appendChild(row); d.appendChild(box); kit.appendChild(d);
  });
})();
</script>

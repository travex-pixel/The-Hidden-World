<title>{{PAGE_TITLE}}</title>
<style>
:root{
  --bg:#f4f2ee;--card:#ffffff;--ink:#1b1b1f;--muted:#5d5d66;--line:#dcd8d0;
  --accent:#b3261e;--accent-ink:#ffffff;--ok:#1e7b34;--bar:#ece8e1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214;--card:#1c1c20;--ink:#eeeef0;--muted:#a0a0aa;--line:#2e2e34;
    --accent:#e5534b;--accent-ink:#ffffff;--ok:#57c26f;--bar:#2a2a30;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;--card:#1c1c20;--ink:#eeeef0;--muted:#a0a0aa;--line:#2e2e34;
  --accent:#e5534b;--accent-ink:#ffffff;--ok:#57c26f;--bar:#2a2a30;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
h1{font-size:1.3rem;line-height:1.3;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 20px;font-size:.92rem}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
button{appearance:none;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  font:600 1.05rem/1 inherit;padding:16px 18px;width:100%;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;margin:18px 0 8px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#status{min-height:1.5em;font-size:.95rem}
#status.ok{color:var(--ok);font-weight:600}
#status.err{color:var(--accent);font-weight:600}
.note{color:var(--muted);font-size:.85rem;margin:18px 0 0}
code{font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>

<main>
  <div class="card">
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
    <dl>
      <dt>File</dt><dd id="fname">{{FILENAME}}</dd>
      <dt>Size</dt><dd>{{SIZE_HUMAN}}</dd>
      <dt>Video</dt><dd>{{VIDEO}}</dd>
      <dt>Status</dt><dd>{{STATUS}}</dd>
    </dl>

    <button id="go" disabled>Connecting…</button>
    <button id="save" class="secondary" hidden>Save MP4 again</button>

    <div class="bar" id="barwrap" hidden><i id="bar"></i></div>
    <div id="status"></div>

    <p class="note">{{NOTE}}</p>
    <p class="note">SHA-256 of the original:<br><code>{{SHA256}}</code></p>
  </div>
</main>

<script>
(() => {
  const NAME = "{{FILENAME}}";
  const TOTAL = {{SIZE}};
  const CHUNK = {{CHUNK}};
  const COUNT = Math.ceil(TOTAL / CHUNK);
  const url = i => "c/c" + String(i).padStart(2, "0") + ".mp4";
  const sizeOf = i => i < COUNT - 1 ? CHUNK : TOTAL - CHUNK * (COUNT - 1);

  const $ = id => document.getElementById(id);
  const go = $("go"), again = $("save"), bar = $("bar"), status = $("status");
  const parts = [];
  let done = 0, file = null, downloads = null, busy = false;

  const say = (msg, cls) => { status.textContent = msg; status.className = cls || ""; };
  const mb = n => (n / 1048576).toFixed(1);
  const progress = () => { bar.style.width = (100 * done / TOTAL).toFixed(1) + "%"; };

  claude.use("downloads").then(d => {
    downloads = d;
    if (!d) {
      go.textContent = "Saving isn't available here";
      say("Open this link in Chrome on your phone and try again.", "err");
      return;
    }
    go.disabled = false;
    go.textContent = "Download MP4 ({{MIB}} MiB)";
  });

  async function fetchChunk(i) {
    let lastErr;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const r = await fetch(url(i), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const b = await r.blob();
        if (b.size !== sizeOf(i)) throw new Error("part " + i + " is " + b.size + " bytes, expected " + sizeOf(i));
        return b;
      } catch (e) {
        lastErr = e;
        await new Promise(res => setTimeout(res, 1500 * (attempt + 1)));
      }
    }
    throw lastErr;
  }

  async function save() {
    again.hidden = true;
    say("Confirm the save on the prompt…");
    try {
      await downloads.save({ filename: NAME, data: file });
      say("Saved. Look in your Downloads folder for " + NAME + ".", "ok");
      again.hidden = false;
    } catch (e) {
      const code = e && e.code;
      if (code === "too_large") {
        say("The Claude app caps saves at 200 MiB. Open this same link in Chrome and tap Download there.", "err");
      } else if (code === "declined") {
        say("Save cancelled. Tap “Save MP4 again” when ready (no re-download needed).");
        again.hidden = false;
      } else if (code === "rate_limited") {
        say("Another save prompt is open. Close it, then tap “Save MP4 again”.");
        again.hidden = false;
      } else {
        say("Saving isn't available in this view (" + (code || "error") + "). Open this link in Chrome.", "err");
      }
    }
  }

  again.addEventListener("click", () => { if (file && downloads) save(); });

  go.addEventListener("click", async () => {
    if (busy || !downloads) return;
    if (file) { save(); return; }
    busy = true;
    go.disabled = true;
    $("barwrap").hidden = false;
    let lock = null;
    try { lock = await navigator.wakeLock.request("screen"); } catch (_) {}
    try {
      for (let i = parts.length; i < COUNT; i++) {
        say("Downloading… " + mb(done) + " of " + mb(TOTAL) + " MiB");
        parts.push(await fetchChunk(i));
        done += sizeOf(i);
        progress();
      }
      file = new Blob(parts, { type: "video/mp4" });
      if (file.size !== TOTAL) throw new Error("assembled " + file.size + " bytes, expected " + TOTAL);
      go.textContent = "Save MP4 to phone";
      go.disabled = false;
      await save();
    } catch (e) {
      say("Download interrupted (" + e.message + "). Tap the button to resume.", "err");
      go.textContent = "Resume download";
      go.disabled = false;
    } finally {
      busy = false;
      try { lock && lock.release(); } catch (_) {}
    }
  });
})();
</script>

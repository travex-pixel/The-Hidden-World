<!doctype html>
<html><head><meta charset="utf-8"><title>Documentary renderer (1920x1080)</title>
<style>
  @font-face{font-family:'Fraunces';font-weight:600;src:url('../../assets/fonts/Fraunces-SemiBold.ttf')}
  @font-face{font-family:'Fraunces';font-weight:800;src:url('../../assets/fonts/Fraunces-ExtraBold.ttf')}
  @font-face{font-family:'Fraunces';font-weight:600;font-style:italic;src:url('../../assets/fonts/Fraunces-SemiBoldItalic.ttf')}
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<!-- warm up every face the renderer uses so the first frame never falls back -->
<div style="position:absolute;left:-9999px;top:0">
  <span style="font-family:'Inter Display';font-weight:900">a</span><span style="font-family:'Inter Display';font-weight:800">a</span>
  <span style="font-family:Inter;font-weight:500">a</span><span style="font-family:Inter;font-weight:600">a</span><span style="font-family:Inter;font-weight:700">a</span><span style="font-family:Inter;font-weight:800">a</span>
  <span style="font-family:Fraunces;font-weight:600">a</span><span style="font-family:Fraunces;font-weight:800">a</span><span style="font-family:Fraunces;font-weight:600;font-style:italic">a</span>
  <span style="font-family:'Courier 10 Pitch'">a</span>
</div>
<script src="doc.js"></script>
<!-- shared cartoon character rig (read-only reuse of the series engine) for the `character` template -->
<script src="../../renderer/engine.js"></script>
<script src="../../renderer/cast.js"></script>
</body></html>
